<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26170e">
<title>妈祖灵筊 · 一念虔诚</title><meta name="description" content="面朝妈祖，双掌托筊。点击或轻摇手机，体验传统掷筊小游戏。">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="temple" id="game">
<div class="scene" aria-hidden="true"></div><div class="shade" aria-hidden="true"></div>
<header><button class="round" id="sound" aria-label="开启声音" title="声音"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></svg></button><span class="temple-label">天后宫 · 妈祖灵筊</span><button class="round" id="help" aria-label="玩法说明">?</button></header>
<section class="intro"><div class="eyebrow">一 念 虔 诚 · 一 筊 问 心</div><h1>轻摇手机</h1><div class="ornament"><i></i><span>❖</span><i></i></div><p>双掌托筊，随手而动</p></section>
<div class="incense" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="status" id="status" role="status">心中默念所问之事，点击掷筊</div>
<section class="result" id="result" hidden aria-live="polite"><span class="result-label">妈祖灵筊</span><h2 id="result-title"></h2><div class="ornament"><i></i><span>❖</span><i></i></div><p id="result-description"></p><small id="result-faces"></small></section>
<div class="cups" id="cups" aria-hidden="true"><div class="cup left" id="left-cup"></div><div class="cup right" id="right-cup"></div></div>
<footer><button class="throw" id="throw"><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span><span class="button-flower">✥</span><span id="throw-label">点击掷筊</span><span class="button-flower">✥</span></button><button class="motion" id="motion">启用摇手机</button><p class="footnote">心诚则灵 · 民俗体验，仅供娱乐</p></footer>
<dialog id="help-dialog"><button class="close" id="close-help" aria-label="关闭">×</button><span class="eyebrow">传统民俗 · 掷筊</span><h2>一筊，问心</h2><p>面朝妈祖，静心默念一个问题，然后点击「掷筊」或启用体感后轻摇手机。</p><dl><dt>圣筊 · 一平一凸</dt><dd>表示允准，所问之事可行。</dd><dt>笑筊 · 两面皆平</dt><dd>问题尚未明朗，静心想清楚再问。</dd><dt>阴筊 · 两面皆凸</dt><dd>表示未允，换个时机或重新思量。</dd></dl><p class="note">每片筊杯独立随机，结果仅作民俗娱乐参考。</p></dialog>
</main>
<script src="./game.js"></script>
</body></html>
